name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OWD client (workspace deps)
        uses: actions/checkout@v4
        with:
          repository: owdproject/nuxt-desktop
          path: client
          submodules: recursive

      - name: Checkout kit-nuxt-tailwind
        uses: actions/checkout@v4
        with:
          repository: owdproject/nuxt-kit-tailwind
          path: client/packages/owd-kit-nuxt-tailwind

      - name: Checkout kit-nuxt-primevue
        uses: actions/checkout@v4
        with:
          repository: owdproject/nuxt-kit-primevue
          path: client/packages/owd-kit-nuxt-primevue

      - name: Checkout module-fs
        uses: actions/checkout@v4
        with:
          repository: owdproject/nuxt-module-fs
          path: client/packages/owd-module-fs

      - name: Checkout theme-nova
        uses: actions/checkout@v4
        with:
          repository: owdproject/nuxt-theme-nova
          path: client/themes/owd-nuxt-theme-nova

      - name: Overlay this app-classic-audioplayer repo
        uses: actions/checkout@v4
        with:
          path: client/apps/app-classic-audioplayer

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install monorepo dependencies
        working-directory: client
        run: pnpm install --no-frozen-lockfile

      - name: Prepare module and playground
        working-directory: client/apps/app-classic-audioplayer
        run: pnpm run dev:prepare

      - name: Validate module layout
        working-directory: client/apps/app-classic-audioplayer
        run: pnpm run validate

      - name: Generate static playground
        working-directory: client/apps/app-classic-audioplayer
        run: pnpm run dev:generate
        env:
          NUXT_APP_BASE_URL: /app-classic-audioplayer/
